<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" fill="none">
  <g transform="rotate(14 80 80)">
    <!-- Outer dashed/perforated circle -->
    <circle cx="80" cy="80" r="72" stroke="#C85A32" stroke-width="3" stroke-dasharray="8 4" opacity="0.85"/>
    <!-- Inner solid circle -->
    <circle cx="80" cy="80" r="64" stroke="#C85A32" stroke-width="2" opacity="0.75"/>
    <!-- Center double ring -->
    <circle cx="80" cy="80" r="42" stroke="#C85A32" stroke-width="1.5" stroke-dasharray="4 3" opacity="0.6"/>
    
    <!-- Top & Bottom Arc Text -->
    <path id="textArcTop" d="M 24 80 A 56 56 0 0 1 136 80" fill="none"/>
    <path id="textArcBottom" d="M 136 80 A 56 56 0 0 1 24 80" fill="none"/>
    
    <text font-family="'JetBrains Mono', monospace" font-size="9" font-weight="900" fill="#C85A32" letter-spacing="2.5" opacity="0.9">
      <textPath href="#textArcTop" startOffset="50%" text-anchor="middle">
        ★ MOSAIC 2.0 ★
      </textPath>
    </text>

    <text font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="800" fill="#C85A32" letter-spacing="2" opacity="0.9">
      <textPath href="#textArcBottom" startOffset="50%" text-anchor="middle">
        KERALA · 2026
      </textPath>
    </text>

    <!-- Center Badge -->
    <text x="80" y="76" font-family="'Arial Black', sans-serif" font-weight="900" font-size="14" fill="#C85A32" text-anchor="middle" letter-spacing="1" opacity="0.95">FIELD</text>
    <text x="80" y="92" font-family="'Arial Black', sans-serif" font-weight="900" font-size="13" fill="#C85A32" text-anchor="middle" letter-spacing="1" opacity="0.95">CAMP</text>
    <line x1="52" y1="99" x2="108" y2="99" stroke="#C85A32" stroke-width="1.5" opacity="0.8"/>
    <text x="80" y="108" font-family="'JetBrains Mono', monospace" font-size="6.5" font-weight="700" fill="#C85A32" text-anchor="middle" letter-spacing="1" opacity="0.8">IEEE SPS</text>
  </g>
</svg>
