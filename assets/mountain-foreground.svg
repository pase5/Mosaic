<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 450" preserveAspectRatio="none" fill="none">
  <!-- Foreground Dark Mountain Ridge with Explorer Silhouette -->
  <!-- Lone Hiker / Explorer Silhouette on the ridge at x=1220, y=140 -->
  <g fill="#100D1C">
    <!-- Hiker body -->
    <ellipse cx="1235" cy="116" rx="4.5" ry="5.5"/> <!-- Head -->
    <path d="M1230 122 L1240 122 L1238 144 L1230 144 Z"/> <!-- Torso/jacket -->
    <path d="M1228 126 L1222 134 L1225 136 L1230 130 Z"/> <!-- Backpack -->
    <!-- Walking stick in hand -->
    <line x1="1242" y1="126" x2="1248" y2="152" stroke="#100D1C" stroke-width="2"/>
    <!-- Legs -->
    <path d="M1231 144 L1227 154 L1229 155 L1234 146 Z"/> <!-- Back leg -->
    <path d="M1237 144 L1244 153 L1246 152 L1239 144 Z"/> <!-- Front leg reaching crest -->
  </g>

  <!-- Crags and Pine trees -->
  <g fill="#100D1C">
    <!-- Pine tree silhouettes -->
    <polygon points="180,260 172,280 188,280"/>
    <polygon points="180,250 174,268 186,268"/>
    <polygon points="180,242 176,256 184,256"/>
    
    <polygon points="210,245 200,270 220,270"/>
    <polygon points="210,232 203,254 217,254"/>

    <polygon points="1350,220 1340,250 1360,250"/>
    <polygon points="1350,205 1342,230 1358,230"/>
    <polygon points="1350,192 1345,212 1355,212"/>
  </g>

  <!-- Foreground Mountain Base Silhouette -->
  <path d="M0 290 
           C 140 260 260 300 400 270 
           C 540 240 680 310 820 280 
           C 960 250 1100 290 1200 210 
           C 1220 152 1250 152 1270 230 
           C 1330 260 1390 240 1440 270 
           L 1440 450 
           L 0 450 Z" 
        fill="#100D1C"/>
</svg>
