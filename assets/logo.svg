<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 100" fill="none">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="120%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="3" dy="3" stdDeviation="0" flood-color="#241a10" flood-opacity="1"/>
    </filter>
  </defs>
  <!-- Background Pill Badge -->
  <rect x="4" y="8" width="412" height="84" rx="42" fill="#F7C638" stroke="#241A10" stroke-width="4" filter="url(#shadow)"/>
  
  <!-- Left Starburst Badge -->
  <g transform="translate(16, 16)">
    <!-- 16-point scalloped starburst -->
    <path d="M34 2 L42 12 L56 10 L58 24 L70 30 L66 44 L74 54 L64 64 L66 78 L52 80 L44 92 L34 84 L24 92 L16 80 L2 78 L4 64 L-6 54 L2 44 L-2 30 L10 24 L12 10 L26 12 Z" 
          fill="#F16538" stroke="#241A10" stroke-width="3" transform="scale(0.72) translate(8, 0)"/>
    <!-- Center Bolt Icon -->
    <path d="M30 18 L20 38 L32 38 L24 58 L44 34 L32 34 Z" fill="#FAF3E4" stroke="#241A10" stroke-width="2"/>
  </g>

  <!-- Typography: HACK 4 GOOD -->
  <g transform="translate(92, 10)">
    <!-- Stylized 70s Groovy Text for HACK4GOOD -->
    <text x="0" y="44" font-family="'Shrikhand', 'Arial Black', sans-serif" font-weight="900" font-size="34" fill="#FAF3E4" stroke="#241A10" stroke-width="5" stroke-linejoin="round" letter-spacing="1">HACK<tspan fill="#F16538">4</tspan>GOOD</text>
    <text x="210" y="32" font-family="'Arial Black', sans-serif" font-weight="900" font-size="14" fill="#241A10" letter-spacing="2">2.0</text>
    
    <!-- Subtitle Pill -->
    <rect x="0" y="52" width="280" height="24" rx="12" fill="#241A10"/>
    <text x="140" y="68" font-family="'Space Grotesk', -apple-system, sans-serif" font-weight="700" font-size="11" fill="#F7C638" text-anchor="middle" letter-spacing="1.5">IEEE SPS · TECH-A-THON</text>
  </g>
</svg>
