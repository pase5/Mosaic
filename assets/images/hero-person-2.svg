    <!-- Hair fade style -->
    <path d="M46 64 C46 32 114 32 114 64 C114 70 106 74 106 74 C106 44 54 44 54 74 Z" fill="#2E241E"/>
    <!-- Eyes -->
    <circle cx="68" cy="72" r="4" fill="#241A10"/>
    <circle cx="92" cy="72" r="4" fill="#241A10"/>
    <!-- Eyebrows -->
    <path d="M62 64 L74 64" stroke="#241A10" stroke-width="3"/>
    <path d="M86 64 L98 64" stroke="#241A10" stroke-width="3"/>
    <!-- Stubble -->
    <path d="M58 84 C58 116 102 116 102 84 C96 98 64 98 58 84 Z" fill="#4A3B31" opacity="0.8"/>
    <!-- Big warm smile -->
    <path d="M70 94 Q80 108 90 94 Z" fill="#FAF3E4" stroke="#241A10" stroke-width="2.5"/>
    <!-- Teal T-shirt -->
