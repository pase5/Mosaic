<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 300" fill="none">
  <!-- Polaroid Landscape Photo Card -->
  <rect width="380" height="300" rx="6" fill="#FFFFFF" filter="drop-shadow(0 15px 25px rgba(0,0,0,0.12))"/>
  
  <g transform="translate(18, 18)">
    <rect width="344" height="225" rx="3" fill="#D3E8F4"/>
    
    <!-- Mountain valley backdrop -->
    <path d="M0 80 Q100 40 180 70 T344 60 L344 225 L0 225 Z" fill="#6A8874"/>
    <path d="M0 110 Q120 75 220 100 T344 95 L344 225 L0 225 Z" fill="#4B6854"/>
    
    <!-- Wooden Open-Air Terrace Deck -->
    <polygon points="0,140 344,140 344,225 0,225" fill="#7D5239"/>
    <!-- Deck planks -->
    <line x1="0" y1="165" x2="344" y2="165" stroke="#5A3A27" stroke-width="2"/>
    <line x1="0" y1="190" x2="344" y2="190" stroke="#5A3A27" stroke-width="2"/>
    <line x1="0" y1="215" x2="344" y2="215" stroke="#5A3A27" stroke-width="2"/>

    <!-- Deck Railing -->
    <line x1="0" y1="135" x2="344" y2="135" stroke="#422919" stroke-width="4"/>
    <line x1="40" y1="135" x2="40" y2="155" stroke="#422919" stroke-width="3"/>
    <line x1="120" y1="135" x2="120" y2="155" stroke="#422919" stroke-width="3"/>
    <line x1="200" y1="135" x2="200" y2="155" stroke="#422919" stroke-width="3"/>
    <line x1="280" y1="135" x2="280" y2="155" stroke="#422919" stroke-width="3"/>

    <!-- Collaborative Teams / Makers sitting at picnic table with laptops & sensor breadboards -->
    <rect x="90" y="150" width="160" height="35" rx="3" fill="#A87350"/>
    <polygon points="80,185 260,185 250,195 90,195" fill="#5A3A27"/>
    
    <!-- Makers -->
    <!-- Person 1 -->
    <circle cx="120" cy="140" r="10" fill="#E8B092"/>
    <rect x="110" y="150" width="20" height="24" fill="#C85A32"/>
    <!-- Laptop -->
    <polygon points="125,148 140,148 142,154 123,154" fill="#241A10"/>

    <!-- Person 2 -->
    <circle cx="170" cy="138" r="9.5" fill="#F0C5A9"/>
    <rect x="160" y="148" width="20" height="26" fill="#2C3D30"/>
    
    <!-- Person 3 -->
    <circle cx="220" cy="140" r="10" fill="#E8B79B"/>
    <rect x="210" y="150" width="20" height="24" fill="#294A5F"/>
    <!-- Solar sensor model on table -->
    <circle cx="195" cy="148" r="4" fill="#F7C638"/>
    <line x1="195" y1="148" x2="195" y2="154" stroke="#241A10" stroke-width="2"/>
  </g>

  <!-- Coordinates footer -->
  <text x="190" y="275" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="800" fill="#7D7466" letter-spacing="2" text-anchor="middle">
    FIELD LABS · WESTERN GHATS BASECAMP
  </text>
</svg>
