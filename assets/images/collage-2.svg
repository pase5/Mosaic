<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250" fill="none">
  <defs>
    <linearGradient id="citySky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#80CEEE"/>
      <stop offset="100%" stop-color="#E2F2FA"/>
    </linearGradient>
  </defs>
  <rect width="400" height="250" rx="16" fill="url(#citySky)"/>
  <!-- Modern Campus Glass Buildings -->
  <polygon points="40,20 160,50 160,200 40,200" fill="#D3E6EF" stroke="#241A10" stroke-width="2"/>
  <polygon points="180,40 320,10 320,200 180,200" fill="#C2DCED" stroke="#241A10" stroke-width="2"/>
  <!-- Windows pattern -->
  <line x1="60" y1="60" x2="140" y2="80" stroke="#8EBAD4" stroke-width="2"/>
  <line x1="60" y1="100" x2="140" y2="120" stroke="#8EBAD4" stroke-width="2"/>
  <line x1="60" y1="140" x2="140" y2="160" stroke="#8EBAD4" stroke-width="2"/>
  <line x1="200" y1="70" x2="300" y2="50" stroke="#7BA9C7" stroke-width="2"/>
  <line x1="200" y1="110" x2="300" y2="90" stroke="#7BA9C7" stroke-width="2"/>
  <line x1="200" y1="150" x2="300" y2="130" stroke="#7BA9C7" stroke-width="2"/>
  <!-- Sunlit courtyard & trees -->
  <rect y="170" width="400" height="80" fill="#75B064"/>
  <circle cx="100" cy="160" r="28" fill="#4B8C3E"/>
  <circle cx="280" cy="155" r="32" fill="#529944"/>
  <!-- Happy Festival Crowds chatting in courtyard -->
  <circle cx="160" cy="186" r="8" fill="#F0C5A9"/>
  <rect x="154" y="194" width="12" height="24" fill="#E84E38"/>
  <circle cx="180" cy="184" r="8" fill="#E8B092"/>
  <rect x="174" y="192" width="12" height="26" fill="#F7C638"/>
  <circle cx="210" cy="188" r="7.5" fill="#E8B79B"/>
  <rect x="204" y="196" width="12" height="22" fill="#52ABA4"/>
  <!-- Border -->
  <rect x="4" y="4" width="392" height="242" rx="14" fill="none" stroke="#241A10" stroke-width="4"/>
</svg>
