<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250" fill="none">
  <!-- Sky -->
  <rect width="400" height="250" rx="16" fill="#DDF2FA"/>
  <!-- Garden Trees & Hedgerows -->
  <ellipse cx="60" cy="180" rx="60" ry="70" fill="#3D7532"/>
  <ellipse cx="340" cy="180" rx="60" ry="70" fill="#3D7532"/>
  <rect y="190" width="400" height="60" fill="#88C776"/>
  <!-- Stone Walkway -->
  <polygon points="170,250 230,250 215,160 185,160" fill="#D9CCA8" stroke="#241A10" stroke-width="2"/>
  
  <!-- Ribbon Rainbow Entrance Archway -->
  <path d="M120 190 C120 90 280 90 280 190" stroke="#F16538" stroke-width="12" fill="none"/>
  <path d="M126 190 C126 96 274 96 274 190" stroke="#F7C638" stroke-width="10" fill="none"/>
  <path d="M132 190 C132 102 268 102 268 190" stroke="#52ABA4" stroke-width="8" fill="none"/>
  <path d="M138 190 C138 108 262 108 262 190" stroke="#7DA379" stroke-width="6" fill="none"/>
  
  <!-- Welcome Sign Board on Arch -->
  <rect x="150" y="80" width="100" height="26" rx="6" fill="#FAF3E4" stroke="#241A10" stroke-width="3"/>
  <text x="200" y="98" font-family="'Arial Black', sans-serif" font-weight="900" font-size="10" fill="#241A10" text-anchor="middle" letter-spacing="1">FLOW ZONE</text>
  
  <!-- Flowers and festive plant tubs -->
  <circle cx="100" cy="195" r="8" fill="#F16538"/>
  <circle cx="115" cy="200" r="7" fill="#F7C638"/>
  <circle cx="285" cy="200" r="7" fill="#F7C638"/>
  <circle cx="300" cy="195" r="8" fill="#F16538"/>
  
  <!-- Border -->
  <rect x="4" y="4" width="392" height="242" rx="14" fill="none" stroke="#241A10" stroke-width="4"/>
</svg>
