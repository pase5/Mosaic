<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 440" fill="none">
  <!-- Polaroid White Photo Card -->
  <rect width="360" height="440" rx="6" fill="#FFFFFF" filter="drop-shadow(0 15px 25px rgba(0,0,0,0.12))"/>
  
  <!-- Photo Inner Frame -->
  <g transform="translate(18, 18)">
    <rect width="324" height="350" rx="3" fill="#A4CDE0"/>
    
    <!-- Mountain Sky -->
    <linearGradient id="polaroidSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#89BCD6"/>
      <stop offset="60%" stop-color="#C5E3F0"/>
      <stop offset="100%" stop-color="#E8F4FA"/>
    </linearGradient>
    <rect width="324" height="240" fill="url(#polaroidSky)"/>
    
    <!-- Rolling Western Ghats Mountain Ridges -->
    <path d="M0 160 C60 130 140 150 200 135 C260 120 300 140 324 130 L324 350 L0 350 Z" fill="#4B6652"/>
    <path d="M0 190 C80 165 180 195 240 170 C280 155 300 170 324 165 L324 350 L0 350 Z" fill="#2E4434"/>
    
    <!-- Hill Retreat / Field Basecamp Cabin Structure -->
    <g transform="translate(60, 150)">
      <!-- Main Lodge Cabin Roof -->
      <polygon points="100,0 210,50 0,50" fill="#3D2A1D"/>
      <!-- Balcony / Deck Level -->
      <rect x="20" y="50" width="170" height="90" fill="#6E4A35"/>
      <!-- Glass Windows with warm light inside -->
      <rect x="35" y="65" width="30" height="35" fill="#FFE299"/>
      <rect x="75" y="65" width="40" height="35" fill="#FFE299"/>
      <rect x="125" y="65" width="30" height="35" fill="#FFE299"/>
      <line x1="95" y1="65" x2="95" y2="100" stroke="#3D2A1D" stroke-width="2"/>
      <line x1="75" y1="82" x2="115" y2="82" stroke="#3D2A1D" stroke-width="2"/>
      
      <!-- Wooden stilts / deck railing -->
      <rect x="10" y="140" width="190" height="15" fill="#523625"/>
      <line x1="30" y1="155" x2="30" y2="200" stroke="#3D2A1D" stroke-width="5"/>
      <line x1="70" y1="155" x2="70" y2="200" stroke="#3D2A1D" stroke-width="5"/>
      <line x1="110" y1="155" x2="110" y2="200" stroke="#3D2A1D" stroke-width="5"/>
      <line x1="150" y1="155" x2="150" y2="200" stroke="#3D2A1D" stroke-width="5"/>
      <line x1="180" y1="155" x2="180" y2="200" stroke="#3D2A1D" stroke-width="5"/>
      
      <!-- Solar Panels on roof -->
      <polygon points="30,46 70,26 95,46" fill="#1C304A" stroke="#8DA8C7" stroke-width="1.5"/>
      <polygon points="100,46 125,26 150,46" fill="#1C304A" stroke="#8DA8C7" stroke-width="1.5"/>
    </g>

    <!-- Lush Grass Foreground -->
    <path d="M0 310 Q80 290 160 305 T324 300 L324 350 L0 350 Z" fill="#5A7D42"/>
  </g>

  <!-- GPS Coordinates stamped at the bottom of the polaroid -->
  <text x="180" y="405" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="800" fill="#7D7466" letter-spacing="2" text-anchor="middle">
    9.9312° N, 76.2673° E · KERALA
  </text>
</svg>
